<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Meine Ton-KI</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/speech-commands@0.4.0/dist/speech-commands.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #1a1a2e;
      color: white;
      margin: 0;
      padding: 20px;
    }

    h1 {
      font-size: 2em;
      margin-bottom: 10px;
    }

    p.subtitle {
      color: #aaa;
      margin-bottom: 20px;
    }

    button {
      padding: 15px 40px;
      font-size: 20px;
      background: #e94560;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin: 10px;
      transition: background 0.3s;
    }

    button:hover {
      background: #c73650;
    }

    #gehoert {
      font-size: 2.5em;
      font-weight: bold;
      min-height: 1.6em;
      margin: 20px 0;
      color: #4ade80;
    }

    #label-container {
      max-width: 450px;
      margin: 20px auto;
    }

    .bar {
      height: 35px;
      margin: 8px 0;
      background: #e94560;
      border-radius: 8px;
      text-align: left;
      padding: 6px 14px;
      color: white;
      font-size: 14px;
      font-weight: bold;
      line-height: 23px;
      min-width: 150px;
      transition: width 0.3s ease;
      white-space: nowrap;
    }

    .status {
      background: #16213e;
      padding: 10px;
      border-radius: 8px;
      margin: 10px auto;
      max-width: 450px;
      font-size: 14px;
      color: #aaa;
    }
  </style>
</head>
<body>

  <!-- =============================================
       AENDERE HIER DEINEN TITEL!
       ============================================= -->
  <h1>👂 Meine KI hoert: ???</h1>

  <p class="subtitle">Mach ein Geraeusch und schau, ob die KI es erkennt!</p>

  <button onclick="start()">🚀 KI starten!</button>

  <div id="status" class="status">Klicke auf den Button um zu starten!</div>
  <div id="gehoert"></div>
  <div id="label-container"></div>

  <script>
    // =============================================
    // HIER DEINE MODELL-URL EINFUEGEN!
    // Achtung: Das muss ein AUDIO-Modell sein!
    // =============================================
    const URL = "DEINE_MODELL_URL_HIER";

    async function start() {
      document.getElementById("status").textContent =
        "Modell wird geladen...";

      try {
        const recognizer = speechCommands.create(
          "BROWSER_FFT",
          undefined,
          URL + "model.json",
          URL + "metadata.json"
        );
        await recognizer.ensureModelLoaded();

        const klassen = recognizer.wordLabels();

        const labelContainer = document.getElementById("label-container");
        labelContainer.innerHTML = "";
        for (let i = 0; i < klassen.length; i++) {
          const div = document.createElement("div");
          div.className = "bar";
          labelContainer.appendChild(div);
        }

        document.getElementById("status").textContent =
          "KI hoert zu! Mach ein Geraeusch!";

        // Das Mikrofon laeuft jetzt dauerhaft.
        // Bei jedem erkannten Geraeusch wird diese Funktion aufgerufen.
        recognizer.listen(function(result) {
          const labels = labelContainer.children;

          let besteKlasse = "";
          let besterWert = 0;

          for (let i = 0; i < klassen.length; i++) {
            const percent = Math.round(result.scores[i] * 100);
            labels[i].style.width = percent + "%";
            labels[i].textContent = klassen[i] + ": " + percent + "%";

            if (result.scores[i] > besterWert) {
              besterWert = result.scores[i];
              besteKlasse = klassen[i];
            }
          }

          // Grosse Anzeige: nur wenn die KI ziemlich sicher ist
          // und es nicht nur Hintergrundgeraeusch war
          if (besterWert > 0.75 && besteKlasse !== "Background Noise") {
            document.getElementById("gehoert").textContent = besteKlasse;
          }
        }, {
          includeSpectrogram: true,
          probabilityThreshold: 0.75,
          overlapFactor: 0.5
        });

      } catch(e) {
        document.getElementById("status").textContent =
          "Fehler! Ist das wirklich ein Audio-Modell? Pruefe die URL.";
        console.error(e);
      }
    }
  </script>

</body>
</html>
