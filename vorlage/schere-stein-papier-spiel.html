<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schere Stein Papier - KI Spiel</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.5/dist/teachablemachine-image.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { font-size: 2rem; margin: 1.2rem 0 0.3rem; }
        .subtitle { color: #94a3b8; margin-bottom: 1rem; }

        .scoreboard {
            display: flex;
            gap: 2rem;
            margin: 0.5rem 0 1rem;
            font-size: 1.3rem;
        }
        .score-item { text-align: center; }
        .score-label { font-size: 0.85rem; color: #94a3b8; }
        .score-num { font-size: 2.5rem; font-weight: 800; }
        .score-du { color: #34d399; }
        .score-ki { color: #f87171; }
        .score-gleich { color: #fbbf24; }

        .arena {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin: 0.5rem 0;
        }

        .player-side {
            text-align: center;
            width: 220px;
        }
        .player-label {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 0.4rem;
        }
        .player-label.du { color: #34d399; }
        .player-label.ki { color: #f87171; }

        .emoji-display {
            font-size: 5rem;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .vs {
            font-size: 2rem;
            font-weight: 800;
            color: #475569;
        }

        .result-text {
            font-size: 1.8rem;
            font-weight: 800;
            min-height: 2.5rem;
            margin: 0.3rem 0;
        }
        .result-win { color: #34d399; }
        .result-lose { color: #f87171; }
        .result-draw { color: #fbbf24; }

        .webcam-container {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            border: 3px solid #1e293b;
            margin: 0.5rem 0;
        }
        .webcam-container canvas {
            display: block;
            border-radius: 13px;
        }

        .confidence {
            font-size: 0.95rem;
            color: #94a3b8;
            min-height: 1.5rem;
        }

        .btn {
            padding: 0.9rem 2.5rem;
            font-size: 1.2rem;
            font-weight: 700;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            margin: 0.5rem 0;
            transition: transform 0.1s;
        }
        .btn:hover { transform: scale(1.04); }
        .btn:active { transform: scale(0.97); }

        .btn-start {
            background: #0d9488;
            color: white;
        }
        .btn-play {
            background: #f59e0b;
            color: #1e293b;
            font-size: 1.4rem;
            padding: 1rem 3rem;
            animation: pulse 1.5s infinite;
        }
        .btn-play:disabled {
            background: #475569;
            color: #94a3b8;
            animation: none;
            cursor: not-allowed;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); }
            50% { box-shadow: 0 0 0 12px rgba(245, 158, 11, 0); }
        }

        .countdown {
            font-size: 5rem;
            font-weight: 900;
            color: #fbbf24;
            min-height: 6rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .instructions {
            background: #1e293b;
            border-radius: 12px;
            padding: 1rem 1.5rem;
            margin: 0.5rem 0;
            color: #94a3b8;
            font-size: 0.95rem;
            max-width: 500px;
            text-align: center;
        }

        .hidden { display: none; }
    </style>
</head>
<body>
    <h1>✂️🪨📄 Schere Stein Papier</h1>
    <p class="subtitle">Spiele gegen den Computer mit deiner KI!</p>

    <!-- Phase 1: Start -->
    <div id="startPhase">
        <button class="btn btn-start" onclick="startGame()">KI laden und spielen!</button>
    </div>

    <!-- Phase 2: Game -->
    <div id="gamePhase" class="hidden">
        <div class="scoreboard">
            <div class="score-item">
                <div class="score-label">Du</div>
                <div class="score-num score-du" id="scoreDu">0</div>
            </div>
            <div class="score-item">
                <div class="score-label">Gleich</div>
                <div class="score-num score-gleich" id="scoreGleich">0</div>
            </div>
            <div class="score-item">
                <div class="score-label">KI</div>
                <div class="score-num score-ki" id="scoreKI">0</div>
            </div>
        </div>

        <div class="arena">
            <div class="player-side">
                <div class="player-label du">DU</div>
                <div class="emoji-display" id="playerEmoji">❓</div>
            </div>
            <div class="vs">VS</div>
            <div class="player-side">
                <div class="player-label ki">COMPUTER</div>
                <div class="emoji-display" id="computerEmoji">❓</div>
            </div>
        </div>

        <div class="result-text" id="resultText"></div>

        <div class="webcam-container">
            <div id="webcam-container"></div>
        </div>

        <div class="confidence" id="confidence"></div>

        <div class="countdown" id="countdown"></div>

        <button class="btn btn-play" id="playBtn" onclick="playRound()">Spielen!</button>

        <div class="instructions">
            Zeige Schere, Stein oder Papier vor die Kamera und drücke <b>Spielen!</b>
        </div>
    </div>

    <script>
        // HIER DEINE MODELL-URL EINFUEGEN:
        const URL = "DEINE_MODELL_URL_HIER";

    // Sicherheitsnetz: haengt einen fehlenden / am Ende automatisch an
    // und entfernt versehentliche Leerzeichen.
    const BASIS = URL.trim().replace(/\/*$/, "") + "/";

        const EMOJIS = {
            "Schere": "✂️",
            "Stein": "🪨",
            "Papier": "📄",
            "Nichts": "❓"
        };

        let model, webcam, maxPredictions;
        let scoreDu = 0, scoreKI = 0, scoreGleich = 0;
        let isPlaying = false;
        let currentPrediction = null;

        async function startGame() {
            document.getElementById("startPhase").classList.add("hidden");
            document.getElementById("gamePhase").classList.remove("hidden");

            const modelURL = BASIS + "model.json";
            const metadataURL = BASIS + "metadata.json";

            try {
                model = await tmImage.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();

                const flip = true;
                webcam = new tmImage.Webcam(280, 210, flip);
                await webcam.setup();
                await webcam.play();
                document.getElementById("webcam-container").appendChild(webcam.canvas);

                window.requestAnimationFrame(loop);
            } catch(e) {
                alert("Fehler beim Laden! Prüfe deine Modell-URL.");
                console.error(e);
            }
        }

        async function loop() {
            webcam.update();
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            if (!model) return;
            const predictions = await model.predict(webcam.canvas);

            let best = { className: "Nichts", probability: 0 };
            for (let p of predictions) {
                if (p.probability > best.probability) best = p;
            }
            currentPrediction = best;

            const percent = Math.round(best.probability * 100);
            document.getElementById("confidence").textContent =
                "Erkannt: " + best.className + " (" + percent + "%)";
        }

        function getComputerChoice() {
            const choices = ["Schere", "Stein", "Papier"];
            return choices[Math.floor(Math.random() * 3)];
        }

        function getWinner(player, computer) {
            if (player === computer) return "draw";
            if (
                (player === "Schere" && computer === "Papier") ||
                (player === "Stein" && computer === "Schere") ||
                (player === "Papier" && computer === "Stein")
            ) return "win";
            return "lose";
        }

        async function playRound() {
            if (isPlaying) return;
            isPlaying = true;

            const btn = document.getElementById("playBtn");
            btn.disabled = true;

            const countdownEl = document.getElementById("countdown");
            const resultEl = document.getElementById("resultText");
            const playerEmojiEl = document.getElementById("playerEmoji");
            const computerEmojiEl = document.getElementById("computerEmoji");

            resultEl.textContent = "";
            resultEl.className = "result-text";
            playerEmojiEl.textContent = "❓";
            computerEmojiEl.textContent = "❓";

            // Countdown
            for (let i = 3; i >= 1; i--) {
                countdownEl.textContent = i;
                await sleep(800);
            }
            countdownEl.textContent = "Jetzt!";
            await sleep(500);
            countdownEl.textContent = "";

            // Read prediction
            const playerChoice = currentPrediction ? currentPrediction.className : "Nichts";

            if (playerChoice === "Nichts" || !EMOJIS[playerChoice]) {
                resultEl.textContent = "Nicht erkannt! Zeig Schere, Stein oder Papier.";
                resultEl.className = "result-text result-draw";
                btn.disabled = false;
                isPlaying = false;
                return;
            }

            const computerChoice = getComputerChoice();
            const result = getWinner(playerChoice, computerChoice);

            playerEmojiEl.textContent = EMOJIS[playerChoice] || "❓";
            computerEmojiEl.textContent = EMOJIS[computerChoice] || "❓";

            if (result === "win") {
                scoreDu++;
                resultEl.textContent = "Du gewinnst! 🎉";
                resultEl.className = "result-text result-win";
            } else if (result === "lose") {
                scoreKI++;
                resultEl.textContent = "Computer gewinnt! 🤖";
                resultEl.className = "result-text result-lose";
            } else {
                scoreGleich++;
                resultEl.textContent = "Gleichstand! 🤝";
                resultEl.className = "result-text result-draw";
            }

            document.getElementById("scoreDu").textContent = scoreDu;
            document.getElementById("scoreKI").textContent = scoreKI;
            document.getElementById("scoreGleich").textContent = scoreGleich;

            btn.disabled = false;
            isPlaying = false;
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
    </script>
</body>
</html>
