<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Meine Posen-KI</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #1a1a2e;
      color: white;
      margin: 0;
      padding: 20px;
    }

    h1 {
      font-size: 2em;
      margin-bottom: 10px;
    }

    p.subtitle {
      color: #aaa;
      margin-bottom: 20px;
    }

    button {
      padding: 15px 40px;
      font-size: 20px;
      background: #e94560;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin: 10px;
      transition: background 0.3s;
    }

    button:hover {
      background: #c73650;
    }

    #canvas {
      border-radius: 12px;
      margin: 20px auto;
      display: block;
    }

    #label-container {
      max-width: 450px;
      margin: 20px auto;
    }

    .bar {
      height: 35px;
      margin: 8px 0;
      background: #e94560;
      border-radius: 8px;
      text-align: left;
      padding: 6px 14px;
      color: white;
      font-size: 14px;
      font-weight: bold;
      line-height: 23px;
      min-width: 150px;
      transition: width 0.3s ease;
      white-space: nowrap;
    }

    .status {
      background: #16213e;
      padding: 10px;
      border-radius: 8px;
      margin: 10px auto;
      max-width: 450px;
      font-size: 14px;
      color: #aaa;
    }
  </style>
</head>
<body>

  <!-- =============================================
       AENDERE HIER DEINEN TITEL!
       ============================================= -->
  <h1>🕺 Meine KI erkennt Posen: ???</h1>

  <p class="subtitle">Stell dich weit genug weg, damit man dich ganz sieht!</p>

  <button onclick="start()">🚀 KI starten!</button>

  <div id="status" class="status">Klicke auf den Button um zu starten!</div>
  <canvas id="canvas"></canvas>
  <div id="label-container"></div>

  <script>
    // =============================================
    // HIER DEINE MODELL-URL EINFUEGEN!
    // Achtung: Das muss ein POSE-Modell sein,
    // kein normales Bild-Modell!
    // =============================================
    const URL = "DEINE_MODELL_URL_HIER";

    // Sicherheitsnetz: haengt einen fehlenden / am Ende automatisch an
    // und entfernt versehentliche Leerzeichen.
    const BASIS = URL.trim().replace(/\/*$/, "") + "/";

    let model, webcam, ctx, maxPredictions;

    async function start() {
      document.getElementById("status").textContent =
        "Modell wird geladen...";

      const modelURL = BASIS + "model.json";
      const metadataURL = BASIS + "metadata.json";

      try {
        model = await tmPose.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();

        const size = 400;
        webcam = new tmPose.Webcam(size, size, true);
        await webcam.setup();
        await webcam.play();

        const canvas = document.getElementById("canvas");
        canvas.width = size;
        canvas.height = size;
        ctx = canvas.getContext("2d");

        const labelContainer = document.getElementById("label-container");
        labelContainer.innerHTML = "";
        for (let i = 0; i < maxPredictions; i++) {
          const div = document.createElement("div");
          div.className = "bar";
          labelContainer.appendChild(div);
        }

        document.getElementById("status").textContent =
          "KI laeuft! Stell dich vor die Kamera!";

        window.requestAnimationFrame(loop);
      } catch(e) {
        document.getElementById("status").textContent =
          "Fehler! Ist das wirklich ein Pose-Modell? Pruefe die URL.";
        console.error(e);
      }
    }

    async function loop() {
      webcam.update();
      await predict();
      window.requestAnimationFrame(loop);
    }

    async function predict() {
      // Schritt 1: PoseNet sucht die Koerperpunkte
      const { pose, posenetOutput } = await model.estimatePose(webcam.canvas);

      // Schritt 2: Dein Modell entscheidet, welche Pose das ist
      const prediction = await model.predict(posenetOutput);

      const labels = document.getElementById("label-container").children;
      for (let i = 0; i < maxPredictions; i++) {
        const percent = Math.round(prediction[i].probability * 100);
        labels[i].style.width = percent + "%";
        labels[i].textContent =
          prediction[i].className + ": " + percent + "%";
      }

      // Schritt 3: Kamerabild und Skelett zeichnen
      drawPose(pose);
    }

    function drawPose(pose) {
      if (!webcam.canvas) return;
      ctx.drawImage(webcam.canvas, 0, 0);

      if (pose) {
        const minConfidence = 0.5;
        tmPose.drawKeypoints(pose.keypoints, minConfidence, ctx);
        tmPose.drawSkeleton(pose.keypoints, minConfidence, ctx);
      }
    }
  </script>

</body>
</html>
